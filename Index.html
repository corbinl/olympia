<!DOCTYPE html>
<html lang="en" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Olympics</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root[data-t="light"]{--bg:#F2EDE1;--bg2:#E8E1D1;--pan:#FBF9F4;--pan2:#EDE6D6;--line:#DCD2BC;--edge:#C9BCA0;
--tx:#26221B;--mut:#5C5546;--dim:#8E8674;--br:#A9713B;--br2:#8A5A2B;--lau:#5F7346;--lau2:#4A5C35;
--g:#4A7A46;--y:#B5772A;--r:#A8402F;--sh:rgba(60,48,30,.10);--vein:rgba(140,125,100,.07);--skin:#D8B489}
:root[data-t="dark"]{--bg:#221E18;--bg2:#2A251E;--pan:#302A22;--pan2:#3A3329;--line:#463D31;--edge:#5B5042;
--tx:#EFE8D6;--mut:#B4AA93;--dim:#8A8170;--br:#C89355;--br2:#E0B978;--lau:#8AA36B;--lau2:#A3BA85;
--g:#6FB566;--y:#D9993C;--r:#D45B49;--sh:rgba(0,0,0,.45);--vein:rgba(220,200,160,.05);--skin:#C9A276}
html,body{background:var(--bg)!important;min-height:100%}
#bg{position:fixed;inset:-10px;z-index:-2;background:var(--bg);
background-image:linear-gradient(122deg,transparent 0%,var(--vein) 17%,transparent 19%,transparent 43%,var(--vein) 46%,transparent 48%,transparent 72%,var(--vein) 76%,transparent 78%),
linear-gradient(64deg,transparent 0%,var(--vein) 29%,transparent 32%,transparent 68%,var(--vein) 72%,transparent 74%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:480px;margin:0 auto;padding:16px 17px 80px}
.num{font-variant-numeric:tabular-nums}
.ser{font-family:"Hoefler Text",Palatino,Georgia,serif}
.mast{display:flex;align-items:center;gap:12px;padding:4px 0}
.mast .lau{width:104px;height:20px;display:block;margin:0 auto 2px}
.mtitle{flex:1;text-align:center}
.mtitle h1{font-size:25px;font-weight:400;margin:0;letter-spacing:.02em}
.rule{height:3px;margin:9px 0 4px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);padding:2px 0}
.rule i{display:block;height:1px;background:linear-gradient(90deg,transparent,var(--br),transparent)}
.sub{font-size:10px;color:var(--dim);letter-spacing:.3em;text-transform:uppercase;text-align:center;margin-bottom:12px}
.av{width:54px;height:54px;border:1px solid var(--edge);border-radius:50%;background:var(--pan);flex:none;overflow:hidden;position:relative}
.av svg{width:100%;height:100%;display:block}
.avlv{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.08em;background:var(--br);color:#FFF9EC;text-transform:uppercase}
.tt{background:var(--pan);border:1px solid var(--edge);color:var(--mut);border-radius:16px;padding:5px 10px;font:10px inherit;font-family:inherit;letter-spacing:.1em;text-transform:uppercase;flex:none}
h2{font-size:11px;color:var(--br2);font-weight:700;margin:0 0 8px;letter-spacing:.17em;text-transform:uppercase}
.card{background:var(--pan);border:1px solid var(--line);border-top:2px solid var(--edge);border-radius:2px;padding:15px;margin-bottom:11px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--mut);font-size:13px}.tiny{color:var(--dim);font-size:12px;line-height:1.45}
.frieze{height:8px;margin:12px 0;background-image:repeating-linear-gradient(90deg,var(--edge) 0 2px,transparent 2px 6px,var(--edge) 6px 8px,transparent 8px 14px);opacity:.45}
.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tabs button{flex:1 1 22%;padding:9px 0;border:1px solid var(--line);border-radius:2px;background:var(--pan);color:var(--mut);font:600 10px inherit;font-family:inherit;letter-spacing:.06em;text-transform:uppercase}
.tabs button.on{background:var(--br);color:#FFF9EC;border-color:var(--br)}
.xpbar{background:var(--pan);border:1px solid var(--line);border-radius:2px;padding:11px 13px;margin-bottom:11px}
.xpbar .r1{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.bar{height:7px;background:var(--pan2);border:1px solid var(--line);margin-top:7px;overflow:hidden}
.bar div{height:100%;background:var(--br)}
.q{display:flex;gap:10px;align-items:flex-start;background:var(--pan);border:1px solid var(--line);border-left:3px solid var(--lau);padding:11px 13px;margin-bottom:6px}
.q .xp{font-size:11px;color:var(--br2);font-weight:700;flex:none}
.item{background:var(--pan);border:1px solid var(--line);border-left:3px solid var(--edge);border-radius:2px;margin-bottom:7px;overflow:hidden}
.head{padding:12px 14px}
.cap{font-size:9px;letter-spacing:.15em;color:var(--br2);text-transform:uppercase;font-weight:700}
.name{font-size:16px;margin-top:2px}
.rx{font-size:12px;color:var(--dim);margin-top:2px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:12px;background:var(--pan2);border:1px solid var(--line);padding:2px 7px;color:var(--mut)}
.body{border-top:1px solid var(--line);padding:13px 14px}
input,textarea,select{background:var(--bg2);border:1px solid var(--line);border-radius:2px;padding:11px;color:var(--tx);font:15px inherit;font-family:inherit;width:100%}
input::placeholder,textarea::placeholder{color:var(--dim)}
.inline{display:flex;gap:6px;margin-bottom:9px}
.inline input.n{width:62px;flex:none}
button.go{background:var(--br);color:#FFF9EC;border:0;border-radius:2px;padding:11px 13px;font:600 15px inherit;font-family:inherit}
button.wide{width:100%;padding:11px;border:1px solid var(--edge);border-radius:2px;background:transparent;color:var(--br2);font:600 11px inherit;font-family:inherit;margin-top:7px;letter-spacing:.1em;text-transform:uppercase}
button.save{width:100%;padding:14px;border:0;border-radius:2px;background:var(--br);color:#FFF9EC;font:700 15px inherit;font-family:inherit;letter-spacing:.05em}
.opts{display:flex;gap:5px}
.opts button{flex:1;padding:10px 2px;border:1px solid var(--line);border-radius:2px;background:var(--pan);color:var(--mut);font:12px inherit;font-family:inherit}
.opts button.sel{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.opts button.sel.g{background:var(--g);border-color:var(--g);color:#fff}
.opts button.sel.y{background:var(--y);border-color:var(--y);color:#fff}
.opts button.sel.r{background:var(--r);border-color:var(--r);color:#fff}
.verdict{border-left:3px solid;padding:12px 14px;margin-bottom:11px;font-size:14px;background:var(--pan)}
.verdict.g{border-color:var(--g);color:var(--g)}
.verdict.y{border-color:var(--y);color:var(--y)}
.verdict.r{border-color:var(--r);color:var(--r)}
.prompt{background:var(--pan);border:1px solid var(--br);padding:15px;margin-bottom:11px}
.how{background:var(--bg2);border:1px solid var(--line);padding:12px;margin-bottom:11px}
.how ul{margin:0;padding-left:16px}
.how li{font-size:13px;color:var(--mut);line-height:1.45;margin-bottom:4px}
.exp{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.exp b{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--br2);margin:9px 0 3px}
.exp p{margin:0;font-size:13px;color:var(--mut);line-height:1.5}
.warn{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:var(--y);line-height:1.45}
.fig{margin-bottom:10px;background:var(--pan);border:1px solid var(--line);padding:5px}
.fig svg{width:100%;height:auto;max-height:96px;display:block}
.fig svg line,.fig svg circle,.fig svg rect,.fig svg path{stroke:var(--mut);stroke-width:2.4;fill:none;stroke-linecap:round}
.fig svg .bl{stroke:var(--edge);stroke-width:3}
.fig svg .hi{stroke:var(--br);stroke-width:2.8}
.fig svg .hi2{stroke:var(--br);fill:var(--br);opacity:.3}
.fig svg text{font-size:8px;fill:var(--dim);stroke:none}
.alt{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);padding:9px 11px;margin-bottom:5px;font-size:13px}
.alt.on{border-color:var(--br);background:var(--pan2)}
.alt button{background:var(--br);color:#FFF9EC;border:0;padding:6px 10px;font:11px inherit;font-family:inherit;letter-spacing:.06em;text-transform:uppercase;flex:none}
.tmr{text-align:center;padding:5px 0 9px}
.tmr .t{font-size:42px;color:var(--br2)}
.tmrb{display:flex;gap:7px}
.tmrb button{flex:1;padding:11px;border:0;border-radius:2px;font:600 14px inherit;font-family:inherit}
.dki{display:flex;gap:10px;align-items:flex-start;background:var(--pan);border:1px solid var(--line);padding:11px 12px;margin-bottom:5px}
.box{width:17px;height:17px;border-radius:2px;background:var(--pan2);flex:none;margin-top:2px;border:1px solid var(--edge)}
.box.on{background:var(--lau);border-color:var(--lau)}
.done{color:var(--dim);text-decoration:line-through}
.blk{border:1px solid var(--edge);border-top:2px solid var(--br);padding:12px;margin-bottom:11px;background:var(--pan)}
.blk h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--br2);margin:0 0 3px}
.link{color:var(--br);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.dom{background:var(--pan);border:1px solid var(--line);padding:13px;margin-bottom:8px}
.ev{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.er{font-size:16px;font-weight:600;color:var(--br2)}
.er small{font-size:11px;color:var(--dim);font-weight:400}
.entry{background:var(--pan);border:1px solid var(--line);padding:11px 13px;margin-bottom:6px;display:flex;gap:10px}
.stripe{width:3px;flex:none}
.del{background:none;border:0;color:var(--dim);font-size:12px;font-family:inherit}
.empty{color:var(--dim);font-size:14px;text-align:center;padding:26px 0;line-height:1.5}
.sl{display:flex;gap:5px}
.sl button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:2px;background:var(--pan);color:var(--mut);font:13px inherit;font-family:inherit}
.sl button.sel{background:var(--lau);color:#FFF9EC;border-color:var(--lau)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin:8px 0}
.spark div{flex:1;background:var(--pan2);border:1px solid var(--line)}
.spark div:last-child{background:var(--br);border-color:var(--br)}
.pct{font-size:13px;font-weight:600}.up{color:var(--lau2)}.dn{color:var(--r)}
.big{font-size:38px;color:var(--br2)}
.tgt{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.tgt b{color:var(--br2)}
.kit{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kitx{flex:1 1 30%;text-align:center;padding:9px 4px;border:1px solid var(--line);background:var(--pan2);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.kitx.on{border-color:var(--br);color:var(--br2);background:var(--pan)}
.heroav{width:170px;height:230px;margin:0 auto;display:block}
.tl{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.4}
.logrow{display:flex;gap:5px;padding:10px 12px;background:var(--bg2);border-top:1px solid var(--line)}
.logrow input{padding:9px;font-size:15px}
.logrow input.n{width:56px;flex:none}
.logrow button{background:var(--br);color:#FFF9EC;border:0;padding:9px 14px;font:700 14px inherit;font-family:inherit;flex:none}
.minirow{display:flex;gap:5px;padding:0 12px 10px;background:var(--bg2)}
.minirow button{flex:1;background:transparent;border:1px solid var(--line);color:var(--mut);padding:7px 0;font:11px inherit;font-family:inherit;letter-spacing:.08em;text-transform:uppercase}
.minirow button.on{border-color:var(--br);color:var(--br2)}
.xpop{position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:50;background:var(--br);color:#FFF9EC;padding:13px 22px;font:700 16px -apple-system,system-ui,sans-serif;box-shadow:0 4px 16px var(--sh);border-radius:2px;text-align:center;max-width:88%}
.xpop small{display:block;font-weight:400;font-size:12px;opacity:.9;margin-top:3px}
.lad{background:var(--pan);border:1px solid var(--line);border-top:2px solid var(--edge);padding:14px;margin-bottom:10px}
.rung{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.rung .n{width:20px;height:20px;border:1px solid var(--edge);flex:none;text-align:center;font-size:11px;line-height:19px;color:var(--dim)}
.rung.done .n{background:var(--lau);border-color:var(--lau);color:#FFF9EC}
.rung.cur .n{background:var(--br);border-color:var(--br);color:#FFF9EC}
.rung.cur{background:var(--bg2);margin:0 -6px;padding:8px 6px}
.lock{font-size:11px;color:var(--y);margin-top:4px}
.done2{color:var(--dim)}

*{transition:background-color .18s ease,border-color .18s ease,color .18s ease}
.card,.item,.lad,.blk,.dki,.q{animation:rise .22s ease both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.bar div{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xpop{animation:pop .3s cubic-bezier(.2,1.4,.3,1) both}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(-14px) scale(.92)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.tabs button{transition:background-color .15s,color .15s,transform .1s}
.tabs button:active{transform:scale(.96)}
button:active{transform:scale(.97)}
.logrow button{transition:transform .1s,background-color .15s}
.item.doneEx{border-left-color:var(--lau)}
.item.doneEx .name:after{content:" ✓";color:var(--lau);font-size:14px}
.floatbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--pan);border-top:2px solid var(--br);
padding:11px 16px calc(11px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;box-shadow:0 -3px 14px var(--sh);
animation:slideup .25s ease both}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.floatbar .ft{font-size:26px;color:var(--br2);font-variant-numeric:tabular-nums;min-width:74px}
.floatbar .fl{flex:1;font-size:12px;color:var(--mut);line-height:1.3}
.floatbar button{background:var(--pan2);border:1px solid var(--edge);color:var(--tx);padding:9px 13px;font:12px inherit;font-family:inherit;letter-spacing:.06em;text-transform:uppercase}
.prog{display:flex;gap:3px;margin:10px 0 14px}
.prog i{flex:1;height:4px;background:var(--pan2);border:1px solid var(--line)}
.prog i.on{background:var(--lau);border-color:var(--lau)}
.wkbar{display:flex;justify-content:space-between;align-items:center;background:var(--pan);border:1px solid var(--line);border-left:3px solid var(--br);padding:10px 13px;margin-bottom:11px;font-size:13px}
.danger{color:var(--r)!important;border-color:var(--r)!important}
.set{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.pbflash{animation:pb .6s ease both}
@keyframes pb{0%{background:var(--br);color:#FFF9EC}100%{background:transparent}}
</style>
</head>

<div class="wrap" id="app"></div>

R("Support hold on books · 20s",
["A book or block in each hand beside your hips. Arms locked straight.","Press down hard. Push your shoulders DOWN away from your ears.","Feet stay on the floor. Lift only your bodyweight into the arms."],
"20 seconds with locked elbows and shoulders actively depressed.",
"Shrugging up into the shoulders. The whole exercise is the opposite of a shrug.",
"Straight-arm support strength and scapular depression — the position underneath every L-sit, dip and ring movement."),
R("Tuck hold · 10s",
["Same support. Now lift both feet and tuck the knees to the chest.","Push the floor down harder than feels necessary. Lean the shoulders slightly forward.","If the hips will not clear, press harder rather than pulling the knees higher."],
"10 seconds with the backside clear of the floor.",
"Trying to lift with the abs while the arms stay passive. It is a pressing exercise first.",
"Support strength plus hip flexor compression. The first genuinely gymnastic position you will own."),
R("Tuck hold · 20s",
["Build with sets. Four sets of 8 becomes one set of 20 faster than grinding singles.","Elevate the hands less as you get stronger — books, then floor.","Keep the chest tall, do not round forward."],
"20 unbroken seconds, hips clear, elbows locked.",
"Letting the elbows bend as fatigue arrives. Stop the set when they do.",
"The endurance to start extending the legs, which roughly doubles the difficulty."),
R("One leg extended · 10s",
["From the tuck, extend one leg straight while the other stays tucked.","Point the toes. Keep the extended leg at hip height or above.","Alternate legs between sets."],
"10 seconds each side with one leg fully straight and level.",
"Dropping the extended leg below the hip. If it sinks, come back to the tuck.",
"The compression strength to hold a straight leg against gravity — the actual limiter for most people, not the arms."),
R("Full L-sit · 10s",
["Both legs straight, together, toes pointed, at or above hip height.","Shoulders down, chest tall, arms locked.","Hamstring flexibility matters here as much as strength."],
"10 seconds with both legs straight and level, no bend at the knee.",
"Bent knees and a rounded back. If both are happening, go back to one leg out.",
"The skill. This is a legitimate calisthenics milestone that most people who train never reach."),
R("Full L-sit · 20s",
["Twenty seconds is a strong L-sit.","Add variation: L-sit on parallettes, then on rings once you have them.","Then start pressing the legs higher toward a V-sit."],
"20 unbroken seconds with clean form.",
"Chasing time at the cost of shape.",
"The base for V-sits, manna work, and L-sit to handstand press.")]],
["pistol","Pistol squat","Floor and a chair. Trainable today.",[
R("Box squat to a chair · 10",
["Stand in front of a chair, both feet down. Push the hips back and sit under control.","Touch and stand without rocking forward.","Heels stay down the whole time."],
"10 controlled reps with no bounce off the chair.",
"Dropping onto the chair instead of controlling down to it.",
"Basic squat control and the hip-back pattern the pistol needs at depth."),
R("Split squat · 12 per leg",
["Feet in a long stance, rear heel up. Drop straight down, front shin near vertical.","Drive through the front heel.","Rear foot laces down if the toe objects."],
"12 clean reps per leg with no wobble.",
"Letting the front knee collapse inward. Track it over the middle toes.",
"Single-leg strength and the ankle range the pistol demands, without the balance problem yet."),
R("Assisted pistol · 5 per leg",
["Hold a doorframe with one or both hands. One leg out in front.","Lower slowly to full depth, use as little arm assistance as you can.","Come up mostly through the leg."],
"5 reps per leg to full depth with light assistance only.",
"Pulling yourself up with the arms. The hands are for balance, not power.",
"Full-range single-leg strength with the balance requirement removed."),
R("Pistol to a chair · 5 per leg",
["One leg out, sit back onto a chair or box, then stand from it on one leg.","Lower the surface as you get stronger.","Arms out in front as a counterweight."],
"5 reps per leg standing up from the chair without pushing off the other foot.",
"Rocking forward to generate momentum. Stand from a dead stop.",
"The concentric strength of the pistol, staged so you can lower the target height gradually."),
R("Full pistol · 1 per leg",
["Free-standing, one leg out, all the way to the bottom and back up.","Arms forward, chest up, heel down.","Ankle dorsiflexion is usually the limiter — your knee-to-wall number matters here."],
"One clean rep per leg, no support, no rocking.",
"Heel lifting off the floor at the bottom. That is an ankle range problem, not a strength one.",
"The skill. Also a direct readout of the ankle work you have been doing."),
R("Full pistol · 5 per leg",

"5 clean reps per leg.",
"Losing depth as reps accumulate.",
"Real single-leg strength, and the base for weighted and plyometric variations.")]],
["flever","Front lever","Needs a bar or rings. Build the base anywhere.",[
R("Scap push-ups · 3 x 10",
["Push-up position, elbows locked. Let the chest sink between the shoulder blades, then push apart.","Only the shoulder blades move. Arms stay straight.","Slow. This is a small movement."],
"3 sets of 10 with no elbow bend and visible blade movement.",
"Turning it into a tiny push-up. If the elbows bend, it is the wrong exercise.",
"Scapular protraction and retraction with straight arms. Almost every stalled lever is a scapular problem."),
R("Active hang · 30s",
["Hang from a bar. Then pull the shoulders DOWN away from the ears without bending the arms.","Ribs down, legs together, body slightly hollow.","Hold that active position rather than dangling."],
"30 seconds actively depressed, arms straight.",
"Passive dangling. If your ears are near your shoulders, you are resting, not training.",
"The starting position for every hanging skill. Also decompresses the spine and opens the shoulder."),
R("Tuck front lever · 10s",
["From an active hang, pull the knees to the chest and lean back until the back is parallel to the floor.","Arms stay straight. Push the bar away slightly.","Ribs down, back rounded, not arched."],
"10 seconds with the torso horizontal and arms locked.",
"Arching the back, which drops the hips and makes it a hang rather than a lever.",
"Straight-arm pulling strength — the quality that has nothing to do with how many pull-ups you can do."),
R("Advanced tuck · 10s",
["Same position, but open the hips so the thighs come away from the chest toward 90 degrees.","Keep the back flat and horizontal.","Significantly harder than the tuck. Expect a long stay here."],
"10 seconds with hips open and the torso still level.",
"Letting the hips sag as the lever lengthens.",
"Straight-arm strength at a longer lever. This is where the real strength gets built."),
R("One leg out · 10s",
["Advanced tuck, then extend one leg fully. Alternate sides.","Point the toe. Keep the hips level — do not let the extended side drop.","Squeeze the glutes."],
"10 seconds each side with the body level.",
"Rotating the hips to make the extended leg easier.",
"Almost the full lever load, staged asymmetrically so you can progress gradually."),
R("Straddle front lever · 10s",
["Both legs out, wide apart. The width makes it easier than legs together.","Body flat, arms locked, ribs down.","Narrow the straddle over time toward a full lever."],
"10 seconds horizontal in a straddle.",
"Piking at the hips so the body is not actually flat.",
"One narrow step from the full front lever.")]],
["flag","Human flag","Needs a vertical pole. Build the base anywhere.",[
R("Side plank · 30s per side",
["Elbow under the shoulder, body in one straight line from head to heels.","Knees bent to start if needed. Hips lifted, not sagging.","Breathe normally."],
"30 seconds each side with the line held.",
"Letting the hips drift backwards so it becomes a twist.",
"Anti-lateral-flexion — the trunk quality the entire flag is built on. Also loads the lateral hip you have been feeling."),
R("Side plank · 60s per side",
["Straight legs now. Stack the feet or stagger them.","Add a top-arm reach overhead to increase the demand.","Build with sets: 3 x 30 becomes 1 x 60."],
"60 unbroken seconds each side.",
"Holding the breath to brace. Learn to brace and breathe simultaneously.",
"The endurance the flag needs. Most flag attempts fail at the trunk long before the arms."),
R("Heavy suitcase carry · 40s per side",
["The heaviest single-hand load you have. Walk tall, do not lean away from it.","Ribs down, shoulder packed, eyes forward.","Both sides equally."],
"40 seconds per side with a genuinely heavy load and no lean.",
"Leaning away from the weight, which removes the entire training effect.",
"Loaded anti-lateral-flexion plus grip. This and the side plank are the flag base you can build in any Airbnb."),
R("Pole support hold · 15s",
["Find a vertical pole. Top hand high in an overhand grip, bottom hand low underhand.","Top arm pulls, bottom arm pushes. That opposition is the whole flag.","Feet stay on the floor. Just feel the two forces."],
"15 seconds with genuine push-pull tension and locked bottom arm.",
"Gripping with both hands the same way. The grips are opposite for a reason.",
"The hand and arm mechanics, learned before any bodyweight is added."),
R("Tuck flag · 5s",
["Same grip. Kick the hips up and tuck the knees tight to the chest.","Push hard with the bottom arm. Keep the bottom elbow locked.","Start by jumping into it rather than pressing up."],
"5 seconds with the hips level and knees tucked.",
"A bent bottom arm, which collapses the whole structure.",
"The first real flag. Enormously demanding on the obliques and the bottom shoulder."),
R("Straddle flag · 5s",
["From the tuck, open the legs into a wide straddle.","Wide legs are easier than legs together. Narrow over months, not weeks.","Body horizontal, not angled up."],
"5 seconds horizontal in a straddle.",
"Angling the body upward to cheat the leverage.",
"One step from the full flag, and one of the most visually absurd things a human body does.")]],
["mu","Muscle-up","Needs a bar. Build the base anywhere.",[
R("Table rows · 3 x 15",
["Under a table, heels out, body straight. Pull the lower chest to the edge.","Pause one second at the top with the blades squeezed.","Feet elevated to progress."],
"3 sets of 15 with a full pause at the top.",
"Pulling with the arms while the shoulder blades stay still.",
"Horizontal pulling volume. You are push-dominant at roughly 20 dips to 8 pull-ups, and this is the correction you can do without a bar."),
R("8 strict pull-ups",
["Full dead hang at the bottom, chin clearly over the bar.","No kipping, no swing. Lower under control.","Build with sets across the week rather than testing constantly."],
"8 strict reps in one set from a dead hang.",
"Cutting the bottom range to add reps. Full extension every time.",
"Baseline vertical pulling strength. Below this the muscle-up transition is not realistically trainable."),
R("12 strict pull-ups",
["Add tempo before adding reps: 3s lowering, then a 2s hold at the top.","Then add load with the carry-on before chasing more reps.","Twelve strict is a strong pull-up."],
"12 strict reps in one set.",
"Grinding to failure every session. Stop two short and come back.",
"The strength reserve the muscle-up pull requires. You need to clear the bar, not just reach it."),
R("12 straight-bar dips",
["On a bar rather than parallel bars — the muscle-up finishes in this position.","Lean the torso slightly forward, keep the bar close to the body.","Full lockout at the top."],
"12 clean reps on a straight bar.",
"Going too deep too early. With your shoulder history, stop at parallel and build from there.",
"The pressing half. Most people have the pull and not the dip, or the reverse."),
R("Explosive high pull to the sternum",

"Bar reaches sternum height on a strict, non-kipping pull.",
"Using a big kip to fake the height. If it needs a swing, you are not there yet.",
"Rate of force development in the pull. The transition happens in the space that explosive pull creates."),
R("Transition on low rings",

"The technical piece. The muscle-up is a skill wearing a strength costume."),
R("Strict muscle-up",

"One strict rep, dead hang to full lockout.",
"Chasing it before the dip and the high pull are both there. That is how shoulders get hurt.",
"The skill. Genuinely rare, and it sits at the top of the beginner-to-intermediate calisthenics ladder.")]]];

var prev=D.rungs[sk]!=null?D.rungs[sk]:-1;D.rungs[sk]=i;save();
pop(i>prev?"+"+((i-prev)*100)+" XP":"Updated",(i>prev?"Rung "+(i+1)+" reached.":"Moved back to rung "+(i+1)+"."))}

function exLabel(id){return swapOf(id)||EX[id][3]}
function todaySets(id){return D.sets.filter(function(s){return s.exId===id&&s.date===today()})}
function setsFor(id){return D.sets.filter(function(s){return s.exId===id&&!s.swap})}
function bestByDate(id){var m={};setsFor(id).forEach(function(s){m[s.date]=Math.max(m[s.date]||0,s.value)});
return Object.keys(m).sort().map(function(d){return[d,m[d]]})}
function stats(id){var ser=bestByDate(id);if(!ser.length)return null;var rs=D.levels[id];
var use=rs?ser.filter(function(a){return a[0]>=rs}):ser;if(!use.length)use=ser;
var b=use[0][1],c=use[use.length-1][1];
return{base:b,cur:c,pct:b>0?Math.round((c-b)/b*100):0,all:Math.max.apply(null,ser.map(function(a){return a[1]})),ser:use.map(function(a){return a[1]}),n:ser.length}}

var val=parseInt(v.value,10);if(!val||val<1)return;
var prev=setsFor(id).reduce(function(a,s){return Math.max(a,s.value)},0);
D.sets.push({id:Date.now(),date:today(),plan:S.plan,exId:id,swap:swapOf(id),value:val,rir:parseInt(r.value,10),load:parseInt(l.value,10)||0});
save();v.value="";pop((prev>0&&val>prev&&!swapOf(id))?"Personal best":"Set logged",exLabel(id)+" · "+val+(l.value?" · "+l.value+" lb":""));startRest();}

function lvl(id){D.levels[id]=today();save();pop("+150 XP","Level up: "+exLabel(id)+". Baseline resets.")}

var ex=[];D.sets.filter(function(s){return s.date===today()}).forEach(function(s){if(ex.indexOf(s.exId)<0)ex.push(s.exId)});
D.sessions.unshift({id:Date.now(),date:today(),plan:S.plan,during:S.dur,am:null,ex:ex,mod:!!mod,note:n?n.value.trim():""});
save();S.dur="none";pop("+"+(100+(mod?75:0))+" XP","Session logged. The app will ask how it feels tomorrow.")}

function pendingAM(){return D.sessions.filter(function(s){return s.am==null&&s.date<today()&&s.date>=ago(3)})[0]}
function claimRest(){if(D.rest.indexOf(today())<0){D.rest.push(today());save();pop("+50 XP","Rest day claimed. That is full compliance.")}}

function dayDone(){return D.daily[today()]||[]}
function dTog(k){var t=today(),a=D.daily[t]||[];var i=a.indexOf(k);
if(i<0)a.push(k);else a.splice(i,1);D.daily[t]=a;save();render()}
function blockDone(b){var d=dayDone();return b[3].every(function(x){return d.indexOf(x[0])>=0})}
function blocksToday(){return DAILY.filter(blockDone).length}

function saveMind(v){D.mind[today()]=Object.assign({},D.mind[today()]||{},v);save();render()}
function bumpBlock(n){var t=today(),m=D.mind[t]||{};m.blocks=Math.max(0,(m.blocks||0)+n);D.mind[t]=m;save();render()}

function evBest(c){var p=D.events.filter(function(e){return e.code===c});if(!p.length)return null;
var v=p.map(function(e){return e.v});return LOWER[c]?Math.min.apply(null,v):Math.max.apply(null,v)}
function evLast(c){var p=D.events.filter(function(e){return e.code===c});return p.length?p[0]:null}
function saveEvent(c){var el=document.getElementById("ev_"+c);var v=parseFloat(el.value);if(isNaN(v))return;
var prev=D.events.filter(function(e){return e.code===c});var b=evBest(c);
D.events.unshift({id:Date.now(),date:today(),code:c,v:v});save();el.value="";
if(prev.length&&(LOWER[c]?v<b:v>b))pop("+250 XP","New record: "+EVMAP[c][0]);else pop("+250 XP","Logged: "+EVMAP[c][0])}

function week(){var ws=wkStart();var ss=D.sessions.filter(function(s){return s.date>=ws});
return{st:ss.filter(function(s){return s.plan!=="C"}).length,ca:ss.filter(function(s){return s.plan==="C"}).length,ss:ss}}
function verdict(){if(pendingAM())return null;
var r=D.sessions.filter(function(s){return s.am!=null}).slice(0,3);
if(!r.length)return["g","No response data yet. Log a session, then answer the morning-after prompt. That loop is the whole point, and it pays the most XP for a reason."];
var l=r[0];
if(l.during==="severe")return["r","Severe symptoms last session. Stop that pathway and get it assessed, especially anything neurological."];
if(l.am==="worse")return["y",(r[1]&&r[1].am==="worse")?"Two in a row worse the next morning. Reduce the dose properly: cut a set, cut range, change the variation. Training hard today earns no XP.":"Worse next morning. Repeat the same dose rather than progressing."];
return["g","Settled by the next morning. Progress: add a rep, add load, or take the harder variation."]}
function backOff(){var v=verdict();return v&&v[0]!=="g"}

function xp(){var x=0;
D.sessions.forEach(function(s){x+=100;if(s.am!=null)x+=75;if(s.mod)x+=75;if(s.plan==="C")x+=0});
D.sessions.filter(function(s){return s.plan==="C"}).forEach(function(){x+=0});
x+=D.rest.length*50;
Object.keys(D.daily).forEach(function(d){DAILY.forEach(function(b){if(b[3].every(function(i){return (D.daily[d]||[]).indexOf(i[0])>=0}))x+=25})});
Object.keys(D.fuel).forEach(function(d){if(D.fuel[d].p>=150)x+=25});
Object.keys(D.mind).forEach(function(d){if(D.mind[d].sleep)x+=15});
x+=Object.keys(D.levels).length*150;
x+=D.events.length*250;
Object.keys(D.rungs).forEach(function(k){x+=(D.rungs[k]+1)*100});
var byd={},days={};D.skillsets.forEach(function(ss){var k=ss.date+"|"+ss.skill;byd[k]=(byd[k]||0)+1;days[ss.date]=1});
Object.keys(byd).forEach(function(k){x+=Math.min(byd[k],5)*20});
x+=Object.keys(days).length*50;
return x}
function tier(){var x=xp(),t=0;TIERS.forEach(function(v,i){if(x>=v[1])t=i});return t}
function nextTier(){var t=tier();return t<TIERS.length-1?TIERS[t+1]:null}
function kits(){var o={};DOMAINS.forEach(function(d){o[d[0]]=d[3].some(function(e){return evBest(e[0])!=null})});return o}

function quests(){var q=[],t=today(),w=week();
if(pendingAM())q.push(["Answer the morning-after prompt",75,"respond"]);
if(blocksToday()<5)q.push(["Complete "+(5-blocksToday())+" more daily blocks",25,"daily"]);
if(w.ca<D.settings.tEng)q.push(["Get an aerobic session in",100,"train"]);
if(w.st<D.settings.tStr&&!backOff())q.push(["Strength session: "+PROG[S.plan].name,100,"train"]);
if(backOff())q.push(["Back-off day. Claim rest, run the daily blocks",50,"daily"]);
if(!D.fuel[t]||!D.fuel[t].p)q.push(["Log protein",25,"fuel"]);
if(!D.mind[t]||!D.mind[t].sleep)q.push(["Log sleep",15,"mind"]);
if(!D.skillsets.some(function(x){return x.date===t}))q.push(["Practise a skill · first set today is worth a bonus",70,"skills"]);
var open=D.rel.filter(function(r){return r.kind==="commit"&&!r.done});
if(open.length)q.push(["Follow up: "+open[0].t.slice(0,34),0,"mind"]);
return q.slice(0,3)}

function startT(sec,lab,kind){stopT();T.left=sec;T.lab=lab;T.kind=kind||"hold";
T.id=setInterval(function(){T.left--;paint();
if(T.left<=0){clearInterval(T.id);T.id=null;pop(T.kind==="rest"?"Rest done":"Time","+ "+T.lab);render()}},1000);render()}

h+='<div class="card"><h2>Bodyweight</h2><div class="spark" style="height:44px">'+bws.map(function(x){return '<div style="height:'+Math.max(10,(x-mn+1)/(mx-mn+1)*100)+'%"></div>'}).join("")+'</div><div class="tiny num">'+bws[0]+' → '+bws[bws.length-1]+' lb · about 1 lb per week is the pace</div></div>'}
var pr=days.map(function(d){return D.fuel[d].p}).filter(function(x){return x>0});
if(pr.length)h+='<div class="card"><h2>Protein</h2><div class="big num ser">'+Math.round(pr.reduce(function(a,b){return a+b},0)/pr.length)+'<span style="font-size:16px;color:var(--dim)"> g avg</span></div><div class="tiny">across '+pr.length+' days</div></div>'}

if(S.tab==="events"){
if(!D.events.length)h+='<div class="card"><div class="tiny">No records yet. Test two or three of these this week — max push-ups, a bodyweight, a knee-to-wall measurement. Each one unlocks a piece of kit on your figure, and they are the only numbers that tell you whether eight weeks of this worked.</div></div>';
h+='<div class="tiny" style="margin-bottom:12px">Seven domains. The decathlon against aging. Injuries are constraints on how the events get trained, not the thing being trained. Retest every six to eight weeks. Each record unlocks the domain\'s kit on your figure.</div>';
DOMAINS.forEach(function(d){var done=d[3].filter(function(e){return evBest(e[0])!=null}).length;
h+='<div class="dom"><div class="row" style="margin-bottom:8px"><div class="ser" style="font-size:17px">'+d[1]+'</div><div class="tiny">'+d[2]+' · '+done+'/'+d[3].length+'</div></div><div class="bar"><div style="width:'+Math.round(done/d[3].length*100)+'%"></div></div>';
d[3].forEach(function(e){var b=evBest(e[0]),l=evLast(e[0]);
h+='<div class="ev"><div><div style="font-size:13px">'+e[1]+'</div>'+(l?'<div class="tiny num">last '+l.v+' on '+l.date+'</div>':'<div class="tiny">not tested</div>')+'</div>'+
'<div class="er num">'+(b!=null?b+' <small>'+e[2]+'</small>':'<span style="color:var(--dim);font-size:13px">—</span>')+'</div></div>'+
'<div class="inline" style="margin:6px 0 2px"><input id="ev_'+e[0]+'" type="number" inputmode="decimal" step="0.1" placeholder="new '+e[2]+'"><button class="go" onclick="saveEvent(\''+e[0]+'\')">Save</button></div>'});
h+='</div>'});
h+='<div class="tiny">Lower is better on the 1.5 mile run and the waist. Aerobic capacity carries the largest health association here and is the strongest lever on Sexual Health, because erectile function is vascular.</div>'}

if(S.tab==="stats"){
var ids=[];D.sets.forEach(function(s){if(ids.indexOf(s.exId)<0)ids.push(s.exId)});
var g=ids.map(function(id){var x=stats(id);return x?{id:id,name:EX[id]?exLabel(id):id,t:x}:null}).filter(function(x){return x&&x.t.n>1});
var avg=g.length?Math.round(g.reduce(function(a,x){return a+x.t.pct},0)/g.length):null;
h+='<div class="card"><div class="row"><span class="muted">This week</span><span class="num">'+w.st+'/3 strength · '+w.ca+'/2 engine</span></div>'+
'<div class="tiny" style="margin-top:6px">Weekly targets, not a daily streak. A planned rest day is full compliance and pays XP.</div></div>';
if(avg!==null)h+='<div class="card"><h2>Average gain</h2><div class="big num ser">'+(avg>=0?"+":"")+avg+'%</div><div class="tiny">Across '+g.length+' tracked movements since each one\'s current baseline. Level up resets a baseline so a harder variation never reads as a loss. A rising number with no level ups means you should have progressed already.</div></div>';
g.sort(function(a,b){return b.t.pct-a.t.pct}).forEach(function(x){var mx=Math.max.apply(null,x.t.ser);
h+='<div class="card" style="padding:13px"><div class="row"><span style="font-size:14px">'+esc(x.name)+'</span><span class="pct num '+(x.t.pct>0?"up":x.t.pct<0?"dn":"")+'">'+(x.t.pct>=0?"+":"")+x.t.pct+'%</span></div><div class="spark">'+
x.t.ser.map(function(v){return '<div style="height:'+Math.max(9,v/mx*100)+'%"></div>'}).join("")+'</div><div class="tiny num">'+x.t.base+' → '+x.t.cur+' · all-time '+x.t.all+' · '+x.t.n+' sessions</div></div>'});
var c={},att=[];
D.sessions.filter(function(s){return s.am!=null}).forEach(function(s){(s.ex||[]).forEach(function(e){
if(!c[e])c[e]={n:0,ww:0};c[e].n++;if(s.am==="worse")c[e].ww++})});
for(var kk in c)if(c[kk].n>=3)att.push({id:kk,n:c[kk].n,w:c[kk].ww});
h+='<h2 style="margin-top:16px">Exposure and response</h2>';
if(!att.length)h+='<div class="empty">Needs three logged sessions with a morning-after answer before patterns mean anything.</div>';
else{h+='<div class="tiny" style="margin-bottom:9px">Correlation only. Tells you what to look at, not what caused what.</div>';
att.sort(function(a,b){return(b.w/b.n)-(a.w/a.n)}).slice(0,8).forEach(function(a){
h+='<div class="card" style="padding:12px"><div style="font-size:14px">'+esc(EX[a.id]?EX[a.id][2]:a.id)+'</div><div class="tiny">preceded a worse morning '+a.w+' of '+a.n+' sessions</div></div>'})}
var sd={};D.skillsets.forEach(function(x){sd[x.skill]=(sd[x.skill]||0)+1});
if(Object.keys(sd).length){h+='<h2 style="margin-top:16px">Skill practice</h2>';
SKILLS.forEach(function(sk){if(!sd[sk[0]])return;var cur=D.rungs[sk[0]]!=null?D.rungs[sk[0]]:-1;
h+='<div class="card" style="padding:12px"><div class="row"><span style="font-size:14px">'+sk[1]+'</span><span class="tiny num">'+sd[sk[0]]+' sets</span></div>'+
'<div class="tiny">rung '+(cur+1)+' of '+sk[3].length+' · practised '+skillDays(sk[0])+' of the last 7 days</div></div>'})}
h+='<h2 style="margin-top:16px">Settings</h2>';
h+='<div class="card"><div class="tgt"><span>Rest timer</span><b>'+(D.settings.rest||"off")+(D.settings.rest?'s':'')+'</b></div><div class="opts" style="margin:8px 0 14px">'+
[0,60,90,120,180].map(function(r){return '<button class="'+(D.settings.rest===r?"sel":"")+'" onclick="setOpt(\'rest\','+r+')">'+(r?r:"Off")+'</button>'}).join("")+'</div>'+
'<div class="tgt"><span>Strength sessions per week</span><b>'+D.settings.tStr+'</b></div><div class="opts" style="margin:8px 0 14px">'+
[2,3,4,5].map(function(r){return '<button class="'+(D.settings.tStr===r?"sel":"")+'" onclick="setOpt(\'tStr\','+r+')">'+r+'</button>'}).join("")+'</div>'+
'<div class="tgt"><span>Aerobic sessions per week</span><b>'+D.settings.tEng+'</b></div><div class="opts" style="margin:8px 0 4px">'+
[1,2,3,4].map(function(r){return '<button class="'+(D.settings.tEng===r?"sel":"")+'" onclick="setOpt(\'tEng\','+r+')">'+r+'</button>'}).join("")+'</div>'+
'<div class="tiny" style="margin-top:10px">Programme started '+D.settings.start+' · currently week '+weekNo()+'.</div></div>';
h+='<h2 style="margin-top:16px">Correct a set</h2>';
var recent=D.sets.slice(-14).reverse();
if(!recent.length)h+='<div class="empty">No sets logged yet. They will appear here so you can fix a typo.</div>';
recent.forEach(function(x){h+='<div class="card" style="padding:10px 13px"><div class="row"><div><div style="font-size:14px">'+esc(EX[x.exId]?EX[x.exId][3]:x.exId)+'</div><div class="tiny num">'+x.date+' · '+x.value+(x.load?" · "+x.load+" lb":"")+'</div></div>'+
'<div><button class="del" onclick="editSet('+x.id+')">Edit</button> <button class="del danger" onclick="rmSet('+x.id+')">Delete</button></div></div></div>'});
h+='<h2 style="margin-top:16px">Backup and restore</h2><div class="tiny" style="margin-bottom:8px">Data lives on this device only. An automatic backup is kept every tenth save.</div>'+
'<button class="wide" onclick="expo()">Copy backup to clipboard</button>'+
'<div class="inline" style="margin-top:10px"><input id="imp" placeholder="paste a backup here"><button class="go" onclick="doImport()">Restore</button></div>'+
'<button class="wide" onclick="recover()">Recover last automatic backup</button>'}

document.getElementById("app").innerHTML=h}
render();
</script>
</body>
</html>
